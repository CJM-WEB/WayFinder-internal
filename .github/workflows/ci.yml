# WayFinder CI baseline
#
# This workflow intentionally contains only deterministic, secret-free checks.
# Provider calls and LLM evals remain explicit review steps because they add
# network variability, cost, and access to protected credentials.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# The job only needs to read the checked-out source. Keeping the token
# read-only limits the impact of a compromised build step.
permissions:
  contents: read

# A newer run for the same branch makes an older in-progress run obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Install and quality gates
    # 使用标准 ARM64 运行器，避开 x64 软件渲染器上已复现的逐帧阻塞。
    runs-on: ubuntu-24.04-arm
    # 安装、构建和 58 条串行浏览器用例共用两小时预算；每项成功后立即进入下一项。
    timeout-minutes: 120

    steps:
      - name: Check out repository
        # actions/checkout v7.0.1; pinning the commit avoids mutable-tag drift.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # CI does not need a persisted Git credential after checkout.
          persist-credentials: false

      - name: Set up pinned Node.js
        # actions/setup-node v7.1.0; .nvmrc is the shared version source.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc

      - name: Enable pinned pnpm
        # Corepack reads packageManager from package.json and activates exactly
        # pnpm 11.25.0 instead of accepting the runner's global pnpm version.
        run: corepack enable

      - name: Show toolchain versions
        run: |
          node --version
          pnpm --version

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Install pinned Chromium for browser E2E
        # GitHub Hosted Runner 已包含 Chromium 所需系统库；这里只安装 lockfile 固定版本的
        # 浏览器，避免 `--with-deps` 重复运行 apt 并受镜像下载波动拖满 Job 时限。
        run: pnpm --filter @wayfinder/web exec playwright install chromium

      - name: 运行确定性质量门禁
        # Package 脚本为必需项，根命令还会按固定包名逐个执行；
        # 缺少或改名的 Workspace 会失败，不会被当作已验证。
        run: pnpm run ci
