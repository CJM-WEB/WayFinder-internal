# 单机入口：仅接纳正式域名，HTTP固定跳转；未知Host不能借默认站点进入应用。
server {
    listen 80;
    server_name cjmproject.com www.cjmproject.com;
    access_log off;
    if ($http_host = "") { return 444; }
    if ($host = www.cjmproject.com) { return 308 https://cjmproject.com$request_uri; }
    if ($host != cjmproject.com) { return 444; }
    return 308 https://cjmproject.com$request_uri;
}

server {
    listen 443 ssl;
    server_name cjmproject.com www.cjmproject.com;
    access_log off;
    if ($http_host = "") { return 444; }
    if ($host = www.cjmproject.com) { return 308 https://cjmproject.com$request_uri; }
    if ($host != cjmproject.com) { return 444; }
    ssl_certificate /etc/nginx/ssl/cjmproject.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/cjmproject.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 首发仅允许回环及目标机自身公网IPv4，随后deny all；实际地址由本机include提供，不进入Git。
    # WAY-144验收通过后才改为allow all并重载，不能提前向普通访客开放。
    include /etc/nginx/wayfinder-access.conf;
    # root创建的空文件暂停新流量；先等待在途运行收敛，再停止服务。
    if (-f /run/wayfinder-maintenance) { return 503; }

    # Nginx是唯一可信第一跳；覆盖外部转发链，不能追加客户端伪造的地址。
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_cache off;
    # Nginx默认消费该控制头；同时保留应用对客户端声明的流式协议字段。
    proxy_pass_header X-Accel-Buffering;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_ignore_client_abort off;
    gzip off;
    # 相邻读取间隔，不替代应用40秒绝对期限；保留应用的no-store响应。
    proxy_read_timeout 60s;
    location / {
        proxy_pass http://127.0.0.1:3000;
    }
    location = /api/workspace {
        # 不额外引入图／完整历史字节额度，底层失败继续由应用明确反馈。
        client_max_body_size 0;
        proxy_pass http://127.0.0.1:3000;
    }
}
